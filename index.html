<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANKHOBA STYLE - Boutique</title>
    <style>
        body {font-family: Arial; margin:0; background:#f8f8f8;}
        header {background:#2c3e50; color:white; padding:20px; text-align:center;}
        .produits {display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; padding:20px;}
        .produit {background:white; border-radius:10px; padding:15px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        .produit img {width:100%; height:350px; object-fit:cover; border-radius:8px;}
        .prix {color:#e74c3c; font-size:24px; font-weight:bold; margin:10px 0;}
        .btn {background:#25D366; color:white; padding:12px 20px; text-decoration:none; border-radius:5px; display:inline-block; margin-top:10px;}
        footer {background:#2c3e50; color:white; text-align:center; padding:20px; margin-top:30px;}
    </style>
</head>
<body>
    <header>
        <h1>👑 YANKHOBA STYLE 🇸🇳</h1>
        <p>Mode Africaine & Moderne à Dakar</p>
    </header>
    <div class="produits">
        <div class="produit">
            <img src="robe.jpg.JPG" alt="Robe de soirée rouge">
            <h2>Robe de Soirée Rouge</h2>
            <p class="prix">20 000 FCFA</p>
            <a href="https://wa.me/221786809553?text=Bonjour je veux la Robe de Soirée Rouge" class="btn">Commander sur WhatsApp</a>
        </div>
        <div class="produit">
            <img src="chemise.jpg.PNG" alt="Chemise blanche moderne">
            <h2>Chemise Blanche + Jean</h2>
            <p class="prix">15 000 FCFA</p>
            <a href="https://wa.me/221786809553?text=Bonjour je veux la Chemise Blanche" class="btn">Commander sur WhatsApp</a>
        </div>
        <div class="produit">
            <img src="boubou.jpg.PNG" alt="T-shirt violet oversize">
            <h2>T-shirt Violet Oversize</h2>
            <p class="prix">12 000 FCFA</p>
            <a href="https://wa.me/221786809553?text=Bonjour je veux le T-shirt Violet" class="btn">Commander sur WhatsApp</a>
        </div>
    </div>
    <footer>
        <h3>Contactez-moi</h3>
        <p>WhatsApp: +221 78 680 95 53</p>
        <p>Dakar, Sénégal</p>
    </footer>
</body>
</html>
